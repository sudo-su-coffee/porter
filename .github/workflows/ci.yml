name: Porter CI

on:
  push:
    branches:
      - main
      - dev-min-changes
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests, vet, build, and vulnerability scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/porter
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  frontend:
    name: Vue build, mock API, and dependency audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm run build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Mock API health check
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/frontend/mock-server.mjs >"${RUNNER_TEMP}/porter-mock.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              curl --fail --silent http://127.0.0.1:8787/projects >/dev/null
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/porter-mock.log"
          exit 1

  shell:
    name: Shell syntax and installer regression checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Test release cache behavior
        run: bash scripts/backend/test-release-cache.sh
      - name: Test PostgreSQL local provisioning behavior
        run: bash scripts/backend/test-postgres-local-setup.sh
      - name: Test PostgreSQL interactive prompting
        run: bash scripts/backend/test-postgres-interactive.sh

  release-contract:
    name: Release contract and workflow policy checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate release workflow policy
        run: |
          set -euo pipefail
          grep -q "pnpm/action-setup@v4" .github/workflows/release.yml
          grep -q "pnpm install --frozen-lockfile" scripts/backend/build-release.sh
          grep -q "PORTER_BASE_IMAGE_DIR is required" scripts/backend/build-release.sh
          grep -q "contents: write" .github/workflows/release.yml
      - name: Validate packaged file contract
        run: |
          set -euo pipefail
          test -x scripts/backend/install.sh
          test -x scripts/backend/install-porter.sh
          test -x scripts/backend/install-firecracker.sh
          test -f release/porter.service
          test -f release/firecracker-versions.json
          test -f docs/backend/HOST_ACCEPTANCE.md
