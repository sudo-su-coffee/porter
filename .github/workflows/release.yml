name: Porter Linux release

# Firecracker is three separate concerns here:
#   1. the official VMM binary, fetched and checksum-verified by the installer;
#   2. a guest kernel (vmlinux for x86_64); and
#   3. a guest root filesystem (rootfs.ext4).
# This workflow accepts the latter two as separate files in
# release/guest-artifacts/<architecture>/ when checked into the repository. For
# large files, it can instead download separately named vmlinux/rootfs.ext4
# assets from a GitHub Release. It never treats an OCI image or firectl as a
# guest artifact.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to create"
        required: true
        default: "v1.0.0-beta-dev"
        type: string
      architecture:
        description: "Linux architecture to build"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64
      guest_release_repository:
        description: "Optional GitHub owner/repository containing guest assets"
        required: false
        default: "sudo-su-coffee/porter"
        type: string
      guest_release_tag:
        description: "Optional GitHub Release tag containing guest assets"
        required: false
        default: "base-images-v1.0.0-beta-dev"
        type: string
      guest_kernel_asset:
        description: "Guest kernel Release asset filename"
        required: false
        default: "vmlinux"
        type: string
      guest_rootfs_asset:
        description: "Guest rootfs Release asset filename"
        required: false
        default: "rootfs.ext4"
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: porter-release-${{ github.event_name }}-${{ inputs.release_tag || github.ref_name }}-${{ inputs.architecture || 'x86_64' }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Porter Linux release
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ARCH: ${{ inputs.architecture || 'x86_64' }}
      GUEST_RELEASE_REPOSITORY: ${{ inputs.guest_release_repository || secrets.PORTER_GUEST_RELEASE_REPOSITORY || github.repository }}
      GUEST_RELEASE_TAG: ${{ inputs.guest_release_tag || secrets.PORTER_GUEST_RELEASE_TAG }}
      GUEST_KERNEL_ASSET: ${{ inputs.guest_kernel_asset || 'vmlinux' }}
      GUEST_ROOTFS_ASSET: ${{ inputs.guest_rootfs_asset || 'rootfs.ext4' }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Load separate guest artifacts from folder or GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          guest_dir="$GITHUB_WORKSPACE/release/guest-artifacts/$ARCH"
          kernel="$guest_dir/vmlinux"
          rootfs="$guest_dir/rootfs.ext4"
          if [ -s "$kernel" ] && [ -s "$rootfs" ]; then
            echo "Using guest artifacts from $guest_dir"
          elif [ -s "$GITHUB_WORKSPACE/vmlinux" ] && [ -s "$GITHUB_WORKSPACE/rootfs.ext4" ]; then
            kernel="$GITHUB_WORKSPACE/vmlinux"
            rootfs="$GITHUB_WORKSPACE/rootfs.ext4"
            echo "Using guest artifacts uploaded at repository root"
          else
            [ -n "$GUEST_RELEASE_TAG" ] || { echo "guest files are absent and guest_release_tag is empty" >&2; exit 1; }
            case "$GUEST_RELEASE_REPOSITORY" in
              */*) ;;
              *) echo "guest_release_repository must be owner/repository" >&2; exit 1 ;;
            esac
            base="https://github.com/${GUEST_RELEASE_REPOSITORY}/releases/download/${GUEST_RELEASE_TAG}"
            work="${RUNNER_TEMP}/porter-guest-artifacts"
            mkdir -p "$work"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 900 -o "$work/vmlinux" "$base/$GUEST_KERNEL_ASSET"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 900 -o "$work/rootfs.ext4" "$base/$GUEST_ROOTFS_ASSET"
            kernel="$work/vmlinux"
            rootfs="$work/rootfs.ext4"
          fi
          test -s "$kernel" || { echo "missing real guest kernel: $kernel" >&2; exit 1; }
          test -s "$rootfs" || { echo "missing real guest rootfs: $rootfs" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release-inputs/base-image"
          install -m 0644 "$kernel" "$GITHUB_WORKSPACE/release-inputs/base-image/vmlinux"
          install -m 0644 "$rootfs" "$GITHUB_WORKSPACE/release-inputs/base-image/rootfs.ext4"
          sha256sum "$kernel" | tee "$GITHUB_WORKSPACE/release-inputs/base-image/vmlinux.sha256"
          sha256sum "$rootfs" | tee "$GITHUB_WORKSPACE/release-inputs/base-image/rootfs.ext4.sha256"

      - name: Build Vue dashboard and Go release archives
        shell: bash
        env:
          PORTER_BASE_IMAGE_DIR: ${{ github.workspace }}/release-inputs/base-image
          PORTER_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/backend/build-release.sh "$RELEASE_TAG" "$ARCH"
          dist="${GITHUB_WORKSPACE}/release-dist/${RELEASE_TAG}"
          package="${dist}/porter-${RELEASE_TAG}-${ARCH}.tar.gz"
          base_package="${dist}/porter-base-image-${RELEASE_TAG}-${ARCH}.tar.gz"
          test -s "$package"
          test -s "$base_package"
          (cd "$dist" && sha256sum -c "$(basename "${package}.sha256")")
          (cd "$dist" && sha256sum -c "$(basename "${base_package}.sha256")")
          tar -tzf "$package" | grep -Fx 'porter'
          tar -tzf "$package" | grep -Fx 'install.sh'
          tar -tzf "$package" | grep -Fx 'install-porter.sh'
          tar -tzf "$package" | grep -Fx 'postgres.sh'
          tar -tzf "$package" | grep -Fx 'porter.service'
          tar -tzf "$base_package" | grep -Fx 'base-images/default/vmlinux'
          tar -tzf "$base_package" | grep -Fx 'base-images/default/rootfs.ext4'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Porter ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-dist/${{ env.RELEASE_TAG }}/porter-${{ env.RELEASE_TAG }}-${{ env.ARCH }}.tar.gz
            release-dist/${{ env.RELEASE_TAG }}/porter-${{ env.RELEASE_TAG }}-${{ env.ARCH }}.tar.gz.sha256
            release-dist/${{ env.RELEASE_TAG }}/porter-base-image-${{ env.RELEASE_TAG }}-${{ env.ARCH }}.tar.gz
            release-dist/${{ env.RELEASE_TAG }}/porter-base-image-${{ env.RELEASE_TAG }}-${{ env.ARCH }}.tar.gz.sha256
