# Porter PRODUCTION configuration template.
# install.sh copies this to /etc/porter/porter.toml and substitutes the
# __DB_URL__ / __API_TOKEN__ / __ADMIN_PASSWORD__ placeholders.
# Every key can also be set via a PORTER_* env var (see backend/README.md).

[server]
listen_addr = ":8080"
base_domain = "porter.test"
api_token   = "__API_TOKEN__"      # REQUIRED — paste a random token (openssl rand -hex 32)

[database]
url          = "__DB_URL__"
auto_migrate = true

[firecracker]
containerd_socket = "/run/containerd/containerd.sock"
snapshotter       = "devmapper"
namespace         = "porter"
logs_dir          = "/var/log/porter"
images_dir        = "vms/images"
# kernel_image is owned by the host shim (/etc/containerd/firecracker-runtime.json),
# not by Porter at runtime; provision it with `porter kernel set <path|URL>`.

[admin]
username = "admin"              # bootstrap admin (single-tenant)
password = "__ADMIN_PASSWORD__" # REQUIRED

# Host-routing gateway — the Vercel-style traffic-facing listener. Enable it and
# set listen_addr to the port that faces *.porter.test / *.local domains.
[gateway]
enabled      = false
listen_addr  = ":80"

[dns]
enabled = false     # resolve <svc>.<project>.local for the gateway

[health]
enabled = true      # healthcheck + auto-replace unhealthy VMs

[ssh]
enabled     = false # SSH gateway (requires a task.Exec bridge; not yet wired)
listen_addr = ":2222"
