# Porter local config — real microVM boots (containerd + aws.firecracker).
# Fill in real secrets. Every key can be overridden by a PORTER_* env var.
# Overlayfs snapshotter (works in WSL2; devmapper needs the dm kernel module).

[server]
listen_addr = ":8080"
base_domain = "porter.test"
api_token   = "arsfgvdfxgvesrdfgvsedzxgq3erasdfvezs"      # CHANGE ME — dashboard login returns this as the bearer token

[database]
url          = "postgres://porter:porter@localhost:5432/porter?sslmode=disable"
auto_migrate = true

[firecracker]
containerd_socket = "/run/containerd/containerd.sock"
snapshotter       = "overlayfs"   # WSL2-friendly; switch to devmapper on a full Linux host if provisioned
namespace         = "porter"
logs_dir          = "/var/log/porter"
images_dir        = "vms/images"

[admin]
username = "admin"
password = "change-me"      

[gateway]
enabled     = true
listen_addr = ":80"

[dns]
enabled = true

[health]
enabled = true

[ssh]
enabled     = false
listen_addr = ":2222"
