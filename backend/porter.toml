# Porter local config — direct Firecracker microVM boots.
# Runtime configuration only. Credentials are seeded in PostgreSQL; provide
# PORTER_BOOTSTRAP_ADMIN_PASSWORD once and PORTER_SECRET_KEY through the
# process environment, never in this TOML file.

[server]
listen_addr = ":8080"
base_domain = "porter.test"

[database]
url          = "postgres://porter:porter@localhost:5432/porter?sslmode=disable"
auto_migrate = true

[firecracker]
runtime_mode       = "direct"
base_image_ref     = "base://default"
api_socket_dir     = "/run/porter/firecracker"
kernel_image       = "/var/lib/porter/vmlinux"
rootfs_path        = "/var/lib/porter/rootfs.ext4"
firecracker_bin    = "firecracker"
logs_dir           = "/var/log/porter"
images_dir         = "vms/images"
custom_images_dir  = "vms/custom"

[gateway]
enabled     = true
listen_addr = ":80"

[dns]
enabled = true

[health]
enabled = true

[ssh]
enabled     = false
listen_addr = ":2222"

# ---------------------------------------------------------------------------
[cache]
# Optional Redis read-through cache (fast path for hot reads). Off by default —
# when Redis is unreachable the store degrades gracefully to Postgres reads.
enabled               = true
url                   = "redis://localhost:6379/0"   # no user/password for the local demo
ttl_seconds           = 15
