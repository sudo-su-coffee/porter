# Porter prototype config. This file is read from PORTER_CONFIG (default
# "porter.toml", relative to the working directory the binary runs from).
# Every PORTER_* environment variable overrides the matching value here,
# so this file is optional, not required.

[server]
listen_addr = ":8080"
base_domain = "example.com"
state_file  = "porter.db"          # SQLite database file (created if missing)
api_token   = "REPLACE_WITH_$(openssl rand -hex 32)"  # CHANGE THIS — see note below

[firecracker]
kernel_image    = "./vmlinux"
rootfs_path     = "./rootfs.ext4"
firecracker_bin = "firecracker"

[admin]
# Single prototype admin account — no user database. The dashboard's
# login screen checks these, then hands back api_token above for all
# subsequent API calls (see /login in api.go).
username = "admin"
password = "change-me"
