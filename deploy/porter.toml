# Porter target configuration (production Linux host).
# Copy to /etc/porter/porter.toml and fill in real secrets.
# Every key can also be set via PORTER_* env vars.

[server]
listen_addr = ":8080"
base_domain = "porter.test"
state_file  = "/var/lib/porter/porter.db"
api_token   = "CHANGE_ME"          # required

[firecracker]
containerd_socket = "/run/containerd/containerd.sock"
snapshotter       = "devmapper"
namespace         = "porter"
logs_dir          = "/var/log/porter"
# kernel_image is owned by the host shim (firecracker-runtime.json), not Porter;
# provision it with `porter kernel set <path|URL>`.

[admin]
username = "admin"                  # bootstrap admin (additional users live in SQLite)
password = "CHANGE_ME"              # required
